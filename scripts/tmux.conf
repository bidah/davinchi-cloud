# /etc/tmux.conf on the box. Shells live in one tmux session ("main") so a dropped
# web terminal or ssh connection doesn't kill what runs in it (Claude Code, editor).
# Keepalive: the clock redraws every 15 s, so Daytona's proxy never sees the
# browser terminal as idle and doesn't cut it.
set -g status-interval 15
set -g status-right ' %H:%M:%S '
set -g status-left ' davinchi-cloud '
set -g status-left-length 20
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
